<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141c" />
      <stop offset="50%" stop-color="#09090e" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- 18K Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3c7" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Subtle Gold Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for iOS & Favicon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" />

  <!-- Inner Subtle Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 6" />

  <!-- Central Luxury Star Sparkle -->
  <g transform="translate(256, 120) scale(1.1)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  </g>

  <!-- KLS Monogram -->
  <text 
    x="256" 
    y="285" 
    font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" 
    font-weight="800" 
    font-size="120" 
    fill="url(#goldGrad)" 
    text-anchor="middle" 
    letter-spacing="6"
    filter="url(#goldGlow)"
  >KLS</text>

  <!-- LUXE Subtitle -->
  <text 
    x="256" 
    y="360" 
    font-family="'Cinzel', 'Playfair Display', 'Helvetica Neue', sans-serif" 
    font-weight="700" 
    font-size="42" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="16"
    opacity="0.95"
  >LUXE</text>

  <!-- Subtle Accent Horizontal Dividers -->
  <line x1="120" y1="346" x2="160" y2="346" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7" />
  <line x1="352" y1="346" x2="392" y2="346" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7" />
</svg>
